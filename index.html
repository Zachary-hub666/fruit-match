<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>果趣连连看</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#293e36;font-family:system-ui,'Microsoft YaHei',sans-serif}main{max-width:820px;margin:auto;padding:30px 18px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;margin:8px 0}small{color:#738077}header span{background:#dfe9dc;padding:9px 14px;border-radius:30px;font-size:13px}.intro{color:#738077}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stats div{background:white;border-radius:16px;padding:16px;text-align:center;box-shadow:0 4px 18px #293e3605}.stats strong{display:block;font-size:27px;margin-top:4px}.panel{background:#e8ede1;padding:20px;border-radius:24px;position:relative}#board{display:grid;gap:7px}button,select{font:inherit;border:0;border-radius:10px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #e8a15c;outline-offset:2px}.tile{aspect-ratio:1;background:#fffdf7;font-size:clamp(22px,5vw,40px);box-shadow:0 3px 0 #d4dece;transition:transform .12s}.tile:hover{transform:translateY(-2px)}.tile.selected{background:#f8cf86;outline:3px solid #ce9550}.tile.hint{background:#cee5b5;outline:3px solid #70a457}.tile.empty{visibility:hidden}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0;align-items:center}.actions button,select{padding:12px 16px;background:white;color:#293e36}.actions .primary{background:#365f47;color:white}#message{min-height:26px;font-weight:600}details{background:white;border-radius:16px;padding:18px;margin-top:20px;line-height:1.8}summary{cursor:pointer;font-weight:600}footer{margin-top:22px;color:#8b968d;text-align:center;font-size:12px}#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}@media(max-width:500px){main{padding:18px 12px}.panel{padding:12px}#board{gap:5px}header span{display:none}h1{font-size:28px}.stats div{padding:12px}}
</style></head><body><main><header><div><small>FRUIT MATCH · 益智小游戏</small><h1>🍊 果趣连连看</h1></div><span>让思绪休息一下</span></header><p class="intro">找到相同的水果，用不超过两次转弯的路线连接它们。</p><section class="stats"><div>剩余时间<strong id="time">03:00</strong></div><div>本局得分<strong id="score">0</strong></div><div>剩余配对<strong id="pairs">24</strong></div></section><section class="panel"><div id="board"></div><svg id="lines"></svg></section><div class="actions"><select id="level" aria-label="选择难度"><option value="easy">轻松 · 6 × 6</option><option value="normal" selected>标准 · 6 × 8</option><option value="hard">挑战 · 8 × 8</option></select><button class="primary" id="restart">开始 / 重新开始</button><button id="pause">暂停</button><button id="hint">提示（3）</button><button id="shuffle">洗牌（3）</button></div><p id="message" role="status" aria-live="polite"></p><details><summary>怎么玩？</summary><div>点击两个相同水果。如果连线路线最多转弯两次，并且中间没有其他水果，就能消除。路线可以经过棋盘外侧。每消除一对得 100 分；使用提示扣 20 分，洗牌扣 50 分。没有可消除配对时会自动洗牌，不扣次数。切换难度会开始新一局。暂停时棋盘会隐藏。最高分保存在本机浏览器。</div></details><footer id="best"></footer></main><script>
const $=id=>document.getElementById(id),icons=['🍎','🍊','🍋','🍇','🍓','🍒','🥝','🍉','🍍','🥥','🍑','🫐'];let rows,cols,grid,selected=null,score=0,remaining=180,paused=false,ended=false,busy=false,hints=3,shuffles=3,timer,epoch=0,best=0;try{best=Number(localStorage.getItem('fruit-match-best'))||0}catch{}
function mix(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function path(a,b){if(a===b||!grid[a]||grid[a]!==grid[b])return null;let start=[Math.floor(a/cols)+1,a%cols+1],end=[Math.floor(b/cols)+1,b%cols+1],dirs=[[0,1],[1,0],[0,-1],[-1,0]],queue=[],seen=new Map();for(let d=0;d<4;d++)queue.push({r:start[0],c:start[1],d,t:0,p:[start]});for(let k=0;k<queue.length;k++){let s=queue[k],r=s.r+dirs[s.d][0],c=s.c+dirs[s.d][1];if(r<0||r>rows+1||c<0||c>cols+1)continue;let p=s.p.concat([[r,c]]);if(r===end[0]&&c===end[1])return p;if(r>=1&&r<=rows&&c>=1&&c<=cols&&grid[(r-1)*cols+c-1])continue;for(let d=0;d<4;d++){let t=s.t+(d!==s.d);if(t>2)continue;let key=r+','+c+','+d;if(seen.has(key)&&seen.get(key)<=t)continue;seen.set(key,t);queue.push({r,c,d,t,p})}}return null}
function move(){for(let a=0;a<grid.length;a++)if(grid[a])for(let b=a+1;b<grid.length;b++)if(grid[a]===grid[b]&&path(a,b))return[a,b];return null}
function ensure(){if(!grid.some(Boolean))return;for(let i=0;i<100&&!move();i++){let vals=mix(grid.filter(Boolean));grid=grid.map(v=>v?vals.pop():null)}if(!move()){let vals=grid.filter(Boolean);grid.fill(null);for(let i=0;i<vals.length;i++)grid[i]=vals[i];let a=0,b=vals.findIndex((v,i)=>i>0&&v===vals[0]);[grid[1],grid[b]]=[grid[b],grid[1]]}}
function render(){ $('board').style.gridTemplateColumns=`repeat(${cols},1fr)`;$('board').innerHTML=grid.map((v,i)=>`<button class="tile ${!v?'empty':''} ${i===selected?'selected':''}" data-i="${i}" aria-label="${v?'水果 '+v:'空格'}" ${!v?'disabled':''}>${v||''}</button>`).join('');$('score').textContent=score;$('pairs').textContent=grid.filter(Boolean).length/2;$('time').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('hint').textContent=`提示（${hints}）`;$('shuffle').textContent=`洗牌（${shuffles}）`;$('best').textContent=`本机最高分 ${best} · 无需注册，打开即玩`;$('board').style.visibility=paused?'hidden':'visible';for(let id of ['hint','shuffle'])$(id).disabled=ended||paused||busy;$('pause').disabled=ended||busy}
function finish(win){ended=true;clearInterval(timer);if(win)score+=remaining*5;if(score>best){best=score;try{localStorage.setItem('fruit-match-best',best)}catch{}}$('message').textContent=win?`🎉 全部消除！时间奖励 ${remaining*5} 分，总分 ${score}。`:'⏰ 时间到了，再来一局试试吧！';render()}
function start(){epoch++;clearInterval(timer);[rows,cols,remaining]=$('level').value==='easy'?[6,6,180]:$('level').value==='hard'?[8,8,240]:[6,8,180];grid=[];for(let i=0;i<rows*cols/2;i++)grid.push(icons[i%icons.length],icons[i%icons.length]);mix(grid);ensure();score=0;selected=null;paused=ended=busy=false;hints=shuffles=3;$('lines').innerHTML='';$('pause').textContent='暂停';$('message').textContent='选两个相同水果，开始消除吧。';render();timer=setInterval(()=>{if(!paused&&!ended){remaining--;if(remaining<=0)finish(false);else $('time').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}},1000)}
function draw(p){let panel=document.querySelector('.panel').getBoundingClientRect(),first=$('board').children[0].getBoundingClientRect(),last=$('board').children[1].getBoundingClientRect(),step=last.left-first.left;let pts=p.map(([r,c])=>`${first.left-panel.left+first.width/2+(c-1)*step},${first.top-panel.top+first.height/2+(r-1)*step}`).join(' ');$('lines').innerHTML=`<polyline points="${pts}" fill="none" stroke="#cf9150" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`}
$('board').onclick=e=>{let el=e.target.closest('[data-i]');if(!el||paused||ended||busy)return;let i=+el.dataset.i;if(!grid[i])return;if(selected===null){selected=i;render();return}if(selected===i){selected=null;render();return}let a=selected,p=path(a,i);if(!p){selected=i;$('message').textContent='这两个还连不上，换个水果试试。';render();return}busy=true;let token=epoch;draw(p);render();setTimeout(()=>{if(token!==epoch)return;grid[a]=grid[i]=null;score+=100;selected=null;busy=false;$('lines').innerHTML='';if(!grid.some(Boolean)){finish(true);return}let dead=!move();ensure();$('message').textContent=dead?'没有可连接配对，已免费自动洗牌。':'✨ 成功消除一对！';render()},220)};
$('hint').onclick=()=>{if(paused||ended||busy)return;if(!hints){$('message').textContent='提示次数已用完。';return}let pair=move();if(!pair){ensure();render();pair=move()}hints--;score=Math.max(0,score-20);selected=null;render();pair.forEach(i=>$('board').children[i].classList.add('hint'));$('message').textContent='绿色标出的两个水果可以连接。'};
$('shuffle').onclick=()=>{if(paused||ended||busy)return;if(!shuffles){$('message').textContent='洗牌次数已用完。';return}shuffles--;score=Math.max(0,score-50);let vals=mix(grid.filter(Boolean));grid=grid.map(v=>v?vals.pop():null);ensure();selected=null;$('message').textContent='已重新排列剩余水果。';render()};$('pause').onclick=()=>{if(ended||busy)return;paused=!paused;$('pause').textContent=paused?'继续':'暂停';$('message').textContent=paused?'已暂停，点击继续恢复游戏。':'游戏继续。';render()};$('restart').onclick=start;$('level').onchange=start;start();
</script></body></html>
